name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cake
          POSTGRES_PASSWORD: cake
          POSTGRES_DB: cake_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cake -d cake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cake:cake@localhost:5432/cake_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      SESSION_SECRET: ci-e2e-session-secret-at-least-32-chars
      AUTH_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Run unit tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://cake:cake@localhost:5432/cake_test?schema=public

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
